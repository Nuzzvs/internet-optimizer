name: Android Build (MVP - No Rust)

on:
  push:
    branches: [mvp-sem-rust]
  pull_request:
    branches: [mvp-sem-rust]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          # Install Android commandline-tools
          cd "$HOME"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          mkdir -p $HOME/android-sdk/cmdline-tools/latest
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools/latest
          if [ -d "$HOME/android-sdk/cmdline-tools/latest/cmdline-tools" ]; then
            mv "$HOME/android-sdk/cmdline-tools/latest/cmdline-tools"/* "$HOME/android-sdk/cmdline-tools/latest/"
            rmdir "$HOME/android-sdk/cmdline-tools/latest/cmdline-tools" 2>/dev/null || true
          fi
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # Create local.properties so Gradle finds the Android SDK
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          # Verify SDK setup
          echo "===SDK VERIFICATION==="
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --list 2>/dev/null | grep -E "platforms|build-tools"
          echo "===END_SDK_VERIFICATION==="

      - name: Verify Gradle setup
        run: |
          ./gradlew tasks --no-daemon 2>&1 | head -20
          echo "===GRADLE_READY==="

      - name: Build Android APK
        env:
          ANDROID_HOME: $HOME/android-sdk
          ANDROID_SDK_ROOT: $HOME/android-sdk
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon --no-configuration-cache 2>&1 | tee /tmp/gradle_output.txt
          echo "===GRADLE_BUILD_LOG==="
          cat /tmp/gradle_output.txt
          echo "===END_GRADLE_BUILD_LOG==="
          # Find all APK and AAB files to verify output location
          echo "===FIND_OUTPUT_FILES==="
          find . -name "*.apk" -type f -print
          find . -name "*.aab" -type f -print
          echo "===END_FIND_OUTPUT_FILES==="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
